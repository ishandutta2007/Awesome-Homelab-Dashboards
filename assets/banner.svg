<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#primaryGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.6; }
      50% { r: 7px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      100% { r: 4px; opacity: 0.6; }
    }
    .float-card-1 {
      animation: float1 6s infinite ease-in-out;
    }
    .float-card-2 {
      animation: float2 7s infinite ease-in-out;
    }
    .float-card-3 {
      animation: float3 8s infinite ease-in-out;
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .flow-wave {
      stroke-dasharray: 8 6;
      animation: dash 25s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect width="1198" height="358" x="1" y="1" rx="16" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Placed strictly in the back / sides) -->
  <!-- Ambient Flowing Network Waves in the Background -->
  <path class="flow-wave" d="M 0 100 Q 300 40 600 110 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />
  <path class="flow-wave" d="M 0 280 Q 300 320 600 270 T 1200 290" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Right Floating Metric Widget 1 (Live CPU / Status) -->
  <g class="float-card-1" filter="url(#badgeShadow)">
    <g transform="translate(930, 48)">
      <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="24" cy="26" r="5" fill="#10b981" class="pulse-circle" />
      <text x="38" y="30" class="badge-label" fill="#f8fafc">Server Node: Healthy</text>
      <text x="24" y="55" font-family="monospace" font-size="12" fill="#38bdf8">UPTIME: 99.99%</text>
      <path d="M 130 54 Q 150 42 165 50 T 195 44" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Floating Metric Widget 2 (Services Active) -->
  <g class="float-card-2" filter="url(#badgeShadow)">
    <g transform="translate(910, 142)">
      <rect width="235" height="74" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="24" cy="26" r="5" fill="#38bdf8" />
      <text x="38" y="30" class="badge-label" fill="#f8fafc">Active Services: 48</text>
      <text x="24" y="55" font-family="monospace" font-size="12" fill="#94a3b8">Plex · Sonarr · PiHole</text>
      <rect x="160" y="44" width="55" height="15" rx="7" fill="#6366f1" fill-opacity="0.3" />
      <text x="187" y="55" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">ONLINE</text>
    </g>
  </g>

  <!-- Right Floating Metric Widget 3 (Network Traffic) -->
  <g class="float-card-3" filter="url(#badgeShadow)">
    <g transform="translate(940, 236)">
      <rect width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="24" cy="24" r="5" fill="#c084fc" />
      <text x="38" y="28" class="badge-label" fill="#f8fafc">Docker Engine</text>
      <text x="24" y="52" font-family="monospace" font-size="12" fill="#c084fc">Containers: 32 running</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Icon, Title, Subtitle, Feature Pills -->
  <g transform="translate(75, 55)">
    <!-- Main Dashboard Icon -->
    <g transform="translate(0, 0)">
      <rect width="60" height="60" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
      <!-- Dashboard Layout Icon Graphics -->
      <rect x="12" y="12" width="16" height="14" rx="3" fill="#38bdf8" fill-opacity="0.9" />
      <rect x="32" y="12" width="16" height="22" rx="3" fill="#818cf8" fill-opacity="0.9" />
      <rect x="12" y="30" width="16" height="18" rx="3" fill="#c084fc" fill-opacity="0.9" />
      <rect x="32" y="38" width="16" height="10" rx="3" fill="#38bdf8" fill-opacity="0.6" />
    </g>

    <!-- Category Pill -->
    <g transform="translate(74, 14)">
      <rect width="185" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" class="pulse-circle" />
      <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="115" class="title-text">Awesome Homelab Dashboards</text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="0" y="152" class="subtitle-text">Curated service launchers, self-hosted start pages, widgets &amp; monitoring portals</text>

    <!-- Feature Badges / Highlights Row -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Self-Hosted -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">🏠 Self-Hosted</text>
      </g>

      <!-- Pill 2: Open-Source -->
      <g transform="translate(150, 0)">
        <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" text-anchor="middle">⚡ Open Source</text>
      </g>

      <!-- Pill 3: Live Widgets -->
      <g transform="translate(300, 0)">
        <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#818cf8" text-anchor="middle">📊 Live Widgets</text>
      </g>

      <!-- Pill 4: Star Tracker -->
      <g transform="translate(455, 0)">
        <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#c084fc" text-anchor="middle">⭐ Star Ranked</text>
      </g>
    </g>
  </g>
</svg>
